# Собирает Linux amd64/arm64, пакеты .deb/.rpm (systemd) и прикрепляет к черновику GitHub Release.
# Push тега v*: создаётся draft с артефактами → проверка → вручную Publish release.

name: Release agent binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-agent-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  attach-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.2

      - name: Build Linux amd64 & arm64 and packages
        env:
          VERSION: ${{ steps.tag.outputs.name }}
        run: |
          set -eux
          mkdir -p dist/packages
          for goarch in amd64 arm64; do
            out="openvpn-control-agent-${VERSION}-linux-${goarch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${goarch}" \
              go build -trimpath -ldflags="-s -w -X openvpn-control-agent/internal.AgentVersion=${VERSION}" \
              -o "${out}" ./cmd/agent
            chmod +x packaging/scripts/*.sh packaging/build-packages.sh
            ./packaging/build-packages.sh "${VERSION}" "${goarch}" "${out}" dist/packages
          done
          sha256sum openvpn-control-agent-${VERSION}-linux-amd64 \
            openvpn-control-agent-${VERSION}-linux-arm64 > SHA256SUMS-binaries
          (
            cd dist/packages
            sha256sum ./* > SHA256SUMS-packages
          )

      - name: Upload release assets to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          draft: true
          files: |
            openvpn-control-agent-${{ steps.tag.outputs.name }}-linux-amd64
            openvpn-control-agent-${{ steps.tag.outputs.name }}-linux-arm64
            SHA256SUMS-binaries
            dist/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
